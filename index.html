<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FireLaw AI API WebApp</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --primary: #d71920;
      --primary-dark: #9f1239;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --soft: #fff1f2;
      --blue: #eef6ff;
      --green: #ecfdf5;
      --shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      max-width: 960px;
      margin: 0 auto;
      padding: 14px;
    }

    .header {
      background: linear-gradient(135deg, #d71920, #7f1d1d);
      color: #fff;
      border-radius: 22px;
      padding: 22px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    .header h1 {
      margin: 0 0 6px;
      font-size: 26px;
      letter-spacing: -0.04em;
    }

    .header p {
      margin: 0;
      font-size: 14px;
      opacity: 0.92;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 18px;
      margin: 0;
      letter-spacing: -0.03em;
    }

    .badge {
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--primary-dark);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 13px 14px;
      font-size: 15px;
      line-height: 1.5;
      outline: none;
      resize: vertical;
      background: #fff;
      color: var(--text);
    }

    textarea:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(215, 25, 32, 0.12);
    }

    textarea {
      min-height: 100px;
    }

    label {
      display: block;
      margin: 10px 0 6px;
      font-weight: 800;
      font-size: 14px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .btns {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 13px 12px;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.12s ease;
    }

    button:active { transform: scale(0.98); }
    button:disabled { cursor: not-allowed; opacity: 0.62; }

    .primary { background: var(--primary); color: #fff; }
    .dark { background: #111827; color: #fff; }
    .soft { background: var(--blue); color: #174ea6; }
    .green { background: var(--green); color: #166534; }
    .gray { background: #f3f4f6; color: #374151; }

    .summary {
      display: grid;
      gap: 8px;
      background: #fafafa;
      border: 1px dashed #d1d5db;
      border-radius: 18px;
      padding: 14px;
      font-size: 14px;
    }

    .summary div {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 8px;
    }

    .summary b { color: var(--muted); }

    .chat {
      height: 440px;
      overflow-y: auto;
      background: #f9fafb;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px;
    }

    .msg {
      max-width: 92%;
      margin-bottom: 10px;
      padding: 12px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: keep-all;
    }

    .user {
      margin-left: auto;
      background: var(--primary);
      color: #fff;
      border-bottom-right-radius: 6px;
    }

    .ai {
      margin-right: auto;
      background: #fff;
      border: 1px solid var(--line);
      border-bottom-left-radius: 6px;
    }

    .status {
      font-size: 13px;
      color: var(--muted);
      margin-top: 10px;
      line-height: 1.5;
    }

    @media (min-width: 860px) {
      .grid { grid-template-columns: 0.85fr 1.15fr; align-items: start; }
      .row { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 520px) {
      .app { padding: 10px; }
      .header { padding: 18px; border-radius: 18px; }
      .header h1 { font-size: 22px; }
      .btns { grid-template-columns: 1fr; }
      .chat { height: 390px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="header">
      <h1>FireLaw AI</h1>
      <p>GPTs 프롬프트를 OpenAI API로 호출하는 소방 실무형 AI 웹앱</p>
    </section>

    <section class="grid">
      <div class="card">
        <div class="title-row">
          <h2>① 질문 입력</h2>
          <span class="badge">GPT API 연결형</span>
        </div>

        <label for="mainQuery">최초 질문</label>
        <textarea id="mainQuery" placeholder="예: 민원인이 구조일지 발급을 요청했는데 구조대상자, 가족도 아닌 제3자일 경우 어떻게 해야 할까요?"></textarea>

        <div class="row">
          <div>
            <label for="mode">답변 모드</label>
            <select id="mode">
              <option value="법령 해석">법령 해석</option>
              <option value="현장 대응">현장 대응</option>
              <option value="상황보고">상황보고</option>
              <option value="공문작성">공문작성</option>
              <option value="체크리스트">체크리스트</option>
            </select>
          </div>
          <div>
            <label for="riskLevel">긴급도</label>
            <select id="riskLevel">
              <option value="일반">일반</option>
              <option value="주의">주의</option>
              <option value="긴급">긴급</option>
            </select>
          </div>
        </div>

        <div class="btns">
          <button class="primary" onclick="runMainAnalysis()">AI 해석 생성</button>
          <button class="gray" onclick="resetAll()">전체 초기화</button>
        </div>

        <p class="status" id="status">대기 중</p>

        <hr style="border:none;border-top:1px solid var(--line);margin:16px 0;" />

        <div class="title-row">
          <h2>② 현재 상황 요약</h2>
          <span class="badge">맥락 기억</span>
        </div>

        <div class="summary">
          <div><b>질문 주제</b><span id="sumTopic">미입력</span></div>
          <div><b>핵심 조건</b><span id="sumFacts">미입력</span></div>
          <div><b>답변 모드</b><span id="sumMode">법령 해석</span></div>
          <div><b>대화 수</b><span id="sumCount">0회</span></div>
        </div>

        <div class="btns">
          <button class="soft" onclick="quickAsk('방금 내용을 상황보고 형식으로 작성해줘')">상황보고 전환</button>
          <button class="green" onclick="quickAsk('방금 내용을 공문 또는 민원 답변 문구로 작성해줘')">공문/답변 전환</button>
          <button class="soft" onclick="quickAsk('현장에서 바로 확인할 체크리스트로 정리해줘')">체크리스트</button>
          <button class="gray" onclick="copyContext()">맥락 복사</button>
        </div>
      </div>

      <div class="card">
        <div class="title-row">
          <h2>③ 하단 챗봇</h2>
          <span class="badge">이어 질문</span>
        </div>

        <div class="chat" id="chatBox">
          <div class="msg ai">상단에 질문을 입력한 뒤 AI 해석을 생성하세요. 이후 아래에서 이어서 질문하면 상단 질문과 기존 답변을 기억해서 답변합니다.</div>
        </div>

        <label for="chatInput">이어 질문</label>
        <textarea id="chatInput" placeholder="예: 비공개 결정 통지 문구로 바꿔줘"></textarea>

        <div class="btns">
          <button class="primary" onclick="sendChat()">전송</button>
          <button class="dark" onclick="downloadTxt()">TXT 저장</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const state = {
      mainQuery: "",
      mainAnswer: "",
      mode: "법령 해석",
      riskLevel: "일반",
      chatHistory: [],
      facts: {}
    };

    const FIRELAW_SYSTEM_PROMPT = `# 소방법령 해석 전문가 AI 통합 프롬프트

Role:
소방법령 해석 전문가 역할을 수행합니다.

Context(상황):
- 사용자는 소방공무원, 안전관리자 또는 관계인
- 사용자는 소방법령 또는 관련 법령을 빠르게 찾고 실무에 적용하려고 함
- 답변은 단순 법령 설명이 아니라 “현장 실무 수행 및 행정처리” 중심으로 제공해야 함

Instructions(단계별 지시사항):
- 질문의 핵심 상황을 먼저 분석한다
- 관련 소방법령(법, 시행령, 시행규칙, 화재안전기준, 재난현장 표준작전절차(SOP) 등)을 찾는다
- 필요한 경우 타 법령(건축법, 위험물안전관리법, 다중이용업소법, 도로교통법 등)도 함께 검토한다
- 관련 조항 및 핵심 내용을 간결하게 정리한다
- 법령을 “현장 적용 기준” 중심으로 실무적으로 해석한다
- 단순 조문 나열이 아니라 실제 현장에서 어떻게 적용되는지 설명한다
- 위반 여부 판단 기준을 명확하게 제시한다
- 필요 시 예외사항 또는 판단이 달라질 수 있는 조건도 설명한다
- 행정조치(시정명령, 과태료, 조치명령, 기관통보 등)를 안내한다
- 요청 시 소방 실무에서 사용하는 공문, 안내문, 보고서 형태로 작성한다
- 답변 후 실제 현장에서 이어서 해야 할 “다음 업무 절차”를 단계별로 제안한다
- 필요 시 후속 행정 흐름(보고, 통보, 현장확인, 시스템 입력 등)을 안내한다
- 소방공무원 실무 기준으로 “지금 바로 해야 할 행동” 중심으로 설명한다
- 상황에 따라 추가 확인이 필요한 사항(관할, 대상물 용도, 층수, 면적, 설치연도, 수용인원 등)을 제시한다
- 실무상 주의사항 또는 민원·감사 대응 시 유의사항이 있다면 함께 안내한다
- 답변 마지막에 관련된 연관 질문 3가지를 자동 생성한다

Constraints(제약사항):
- 최신 개정 법령 기준으로 검토하되, 최신성 확인이 어려운 경우 반드시 “최신 개정 여부 확인 필요”라고 표시한다
- 한글로 작성한다
- 법령 용어는 정확하게 사용한다
- 해석은 실무 중심으로 단순하고 명확하게 작성한다
- 불확실한 내용은 반드시 “추정”, “확인 필요”, “관할 판단 필요” 등으로 표시한다
- 단순 법조문 복사보다 실무 적용성과 이해도를 우선한다
- 사용자가 바로 현장 조치할 수 있도록 단계형으로 설명한다
- 법령 간 충돌 가능성이 있는 경우 이를 함께 설명한다
- 과도한 추측이나 임의 해석은 금지한다
- 실제 현장 및 행정 실무에 적용 가능한 수준으로 작성한다

Output Indicator(출력 형식):
답변은 반드시 아래 순서를 유지하여 작성한다.
1. 관련 법령 조항
2. 핵심 요약
3. 현장 적용 기준
4. 위반 판단 기준
5. 행정조치
6. 다음 업무 절차
7. 추가 확인 필요사항
8. 실무상 주의사항
9. 연관 질문 3가지

추가 규칙:
- 항목 제목을 생략하지 않는다
- 출력 순서를 변경하지 않는다
- 실무자가 바로 사용할 수 있도록 작성한다
- 단순 설명형 답변보다 현장 대응 및 행정 실무 중심으로 작성한다`;

    async function runMainAnalysis() {
      const query = document.getElementById("mainQuery").value.trim();
      const mode = document.getElementById("mode").value;
      const riskLevel = document.getElementById("riskLevel").value;

      if (!query) {
        alert("질문을 입력해 주세요.");
        return;
      }

      state.mainQuery = query;
      state.mode = mode;
      state.riskLevel = riskLevel;
      state.facts = extractFacts(query);

      addMessage("user", query);

      const userPrompt = makeUserPrompt(query);
      const answer = await callFireLawApi(userPrompt);

      state.mainAnswer = answer;
      state.chatHistory.push({ role: "user", content: query });
      state.chatHistory.push({ role: "assistant", content: answer });

      addMessage("ai", answer);
      updateSummary();
    }

    async function sendChat() {
      const input = document.getElementById("chatInput");
      const question = input.value.trim();
      if (!question) return;

      addMessage("user", question);

      const userPrompt = `
[상단 최초 질문]
${state.mainQuery}

[상단 AI 해석 결과]
${state.mainAnswer}

[현재 상황 요약]
${JSON.stringify(state.facts, null, 2)}

[현재까지 하단 대화]
${state.chatHistory.map(m => `${m.role}: ${m.content}`).join("\n")}

[사용자 최신 질문]
${question}

위 맥락을 모두 반영하여 답변하세요.
      `.trim();

      const answer = await callFireLawApi(userPrompt);

      state.chatHistory.push({ role: "user", content: question });
      state.chatHistory.push({ role: "assistant", content: answer });

      mergeFacts(extractFacts(question));
      addMessage("ai", answer);
      input.value = "";
      updateSummary();
    }

    async function quickAsk(text) {
      document.getElementById("chatInput").value = text;
      await sendChat();
    }

    async function callFireLawApi(userPrompt) {
      try {
        setLoading(true);
        const response = await fetch("/.netlify/functions/firelaw", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemPrompt: FIRELAW_SYSTEM_PROMPT,
            userPrompt,
            context: {
              mainQuery: state.mainQuery,
              mainAnswer: state.mainAnswer,
              mode: state.mode,
              riskLevel: state.riskLevel,
              facts: state.facts,
              chatHistory: state.chatHistory.slice(-10)
            }
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "API 호출 실패");
        }

        return data.answer;
      } catch (error) {
        console.error(error);
        return `[오류 안내]\nAI API 연결에 실패했습니다.\n\n[확인할 사항]\n1) Netlify 환경변수 OPENAI_API_KEY 설정 여부\n2) netlify/functions/firelaw.js 파일 배포 여부\n3) OpenAI API 결제·한도 상태\n4) 브라우저 개발자도구 Console 오류\n\n[오류 내용]\n${error.message}`;
      } finally {
        setLoading(false);
      }
    }

    function makeUserPrompt(query) {
      return `
[질문 또는 상황 설명]
${query}

[답변 모드]
${state.mode}

[긴급도]
${state.riskLevel}

[요청]
위 질문에 대해 FireLaw AI 프롬프트의 출력 형식을 반드시 지켜 답변하세요.
      `.trim();
    }

    function extractFacts(text) {
      const facts = {};

      if (/구조일지|구급일지|구조활동일지|구급활동일지|정보공개|개인정보|민감정보|제3자|가족|대리인|위임장/.test(text)) {
        facts.topic = "정보공개·개인정보·구조/구급활동일지";
      } else if (/소화전|불법주차|주정차|과태료/.test(text)) {
        facts.topic = "소화전 주변 불법 주정차";
      } else if (/화재|연기|요구조자|붕괴|수난|교통사고|위험물|구조/.test(text)) {
        facts.topic = "현장 대응·상황보고";
      } else if (/공문|보고|계획|훈련|협조/.test(text)) {
        facts.topic = "공문·보고서 작성";
      } else {
        facts.topic = "소방 실무 질의";
      }

      const area = text.match(/(\d{2,5})\s?(㎡|m2|제곱미터)/i);
      if (area) facts.area = `${area[1]}㎡`;

      const floor = text.match(/(지하\s?\d+층|\d+층|[일이삼사오육칠팔구십]+층)/);
      if (floor) facts.floor = floor[0].replace(/\s/g, "");

      const uses = ["도서관", "공장", "창고", "다세대주택", "공동주택", "아파트", "근린생활시설", "판매시설", "노유자시설", "의료시설", "학교", "지하역사"];
      const found = uses.find(u => text.includes(u));
      if (found) facts.buildingUse = found;

      return facts;
    }

    function mergeFacts(newFacts) {
      state.facts = { ...state.facts, ...newFacts };
    }

    function updateSummary() {
      document.getElementById("sumTopic").textContent = state.facts.topic || "미입력";

      const factText = [
        state.facts.buildingUse ? `용도 ${state.facts.buildingUse}` : "",
        state.facts.floor ? `층수 ${state.facts.floor}` : "",
        state.facts.area ? `면적 ${state.facts.area}` : "",
      ].filter(Boolean).join(" / ");

      document.getElementById("sumFacts").textContent = factText || "미입력";
      document.getElementById("sumMode").textContent = `${state.mode} / ${state.riskLevel}`;
      document.getElementById("sumCount").textContent = `${Math.floor(state.chatHistory.length / 2)}회`;
    }

    function addMessage(role, content) {
      const box = document.getElementById("chatBox");
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = content;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function setLoading(isLoading) {
      document.getElementById("status").textContent = isLoading ? "AI 답변 생성 중..." : "대기 중";
      document.querySelectorAll("button").forEach(btn => {
        btn.disabled = isLoading;
      });
    }

    function copyContext() {
      const text = `
[상단 질문]
${state.mainQuery}

[상단 답변]
${state.mainAnswer}

[현재 요약]
${JSON.stringify(state.facts, null, 2)}
      `.trim();

      navigator.clipboard.writeText(text).then(() => alert("현재 맥락이 복사되었습니다."));
    }

    function downloadTxt() {
      const text = `
FireLaw AI 대화 기록

[상단 질문]
${state.mainQuery}

[상단 답변]
${state.mainAnswer}

[대화]
${state.chatHistory.map(m => `${m.role}: ${m.content}`).join("\n\n")}
      `.trim();

      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "firelaw_ai_chat_log.txt";
      a.click();
      URL.revokeObjectURL(url);
    }

    function resetAll() {
      if (!confirm("전체 초기화할까요?")) return;
      state.mainQuery = "";
      state.mainAnswer = "";
      state.mode = "법령 해석";
      state.riskLevel = "일반";
      state.chatHistory = [];
      state.facts = {};
      document.getElementById("mainQuery").value = "";
      document.getElementById("chatInput").value = "";
      document.getElementById("mode").value = "법령 해석";
      document.getElementById("riskLevel").value = "일반";
      document.getElementById("chatBox").innerHTML = '<div class="msg ai">초기화되었습니다. 상단에 질문을 입력하세요.</div>';
      updateSummary();
    }

    updateSummary();
  </script>
</body>
</html>
