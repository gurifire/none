<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#152640" />
  <title>구리시 공동주택 소방시설 지도 - 초안</title>
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css" />
  <style>
    :root {
      --navy:#152640; --navy-2:#203a60; --paper:#f4f7fb; --white:#fff;
      --text:#172033; --muted:#627086; --line:#dce3ec; --receiver:#1677d2; --receiver-marker:#1677d2;
      --siamese:#e33b42; --shadow:0 12px 34px rgba(19,38,66,.17);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:var(--text);background:var(--paper)}
    button,input{font:inherit}
    button{cursor:pointer}
    .app{height:100%;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
    header{z-index:1000;background:linear-gradient(135deg,var(--navy),var(--navy-2));padding:14px 16px 12px;color:#fff;box-shadow:0 5px 20px rgba(12,28,48,.2)}
    .title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1280px;margin:auto}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .badge{width:38px;height:38px;border-radius:11px;background:#fff;color:var(--receiver);display:grid;place-items:center;font-weight:900;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
    h1{font-size:1.08rem;line-height:1.25;margin:0;font-weight:800;letter-spacing:-.02em}
    .subtitle{font-size:.78rem;color:#cbd8e9;margin-top:3px}
    .draft{font-size:.72rem;font-weight:800;padding:5px 8px;border-radius:999px;background:#ffcf5a;color:#3d3000;white-space:nowrap}
    .search-wrap{max-width:1280px;margin:12px auto 0;display:flex;gap:8px}
    .search{position:relative;flex:1}
    .search input{width:100%;height:44px;border:0;border-radius:12px;padding:0 42px 0 42px;color:var(--text);outline:none;box-shadow:0 4px 12px rgba(5,16,31,.12)}
    .search::before{content:'⌕';position:absolute;left:14px;top:7px;color:#43526a;font-size:1.55rem;z-index:1}
    .clear{display:none;position:absolute;right:9px;top:8px;width:28px;height:28px;border:0;border-radius:50%;background:#e8edf4;color:#516078}
    .locate{height:44px;padding:0 14px;border:1px solid rgba(255,255,255,.3);border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-weight:700;white-space:nowrap}
    main{position:relative;min-height:0}
    #map{height:100%;width:100%;background:#dfe6ec}
    .legend{position:absolute;z-index:500;left:112px;top:10px;background:rgba(255,255,255,.96);padding:10px 12px;border-radius:12px;box-shadow:0 6px 20px rgba(22,38,61,.16);font-size:.8rem;line-height:1.8}
    .legend-title{font-weight:800;border-bottom:1px solid var(--line);margin-bottom:5px}
    .dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:-1px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
    .dot.apt{background:var(--navy)} .dot.receiver{background:var(--receiver-marker)} .dot.siamese{background:var(--siamese)}
    .list-panel{position:absolute;z-index:600;right:14px;top:14px;width:300px;max-height:calc(100% - 28px);overflow:auto;background:rgba(255,255,255,.97);border-radius:16px;box-shadow:var(--shadow);padding:12px}
    .panel-head{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 9px}
    .panel-head strong{font-size:.95rem}.count{color:var(--muted);font-size:.78rem}
    .apt-card{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;color:var(--text)}
    .apt-card:hover,.apt-card:focus{border-color:#8ca5c5;background:#f7faff;outline:none}
    .apt-card.active{border:2px solid var(--navy-2);background:#edf4fd}
    .apt-name{font-size:.94rem;font-weight:800}.apt-address{font-size:.75rem;color:var(--muted);margin-top:5px;line-height:1.4}
    .facility-count{font-size:.72rem;color:#40516a;margin-top:8px}
    .marker{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 9px rgba(0,0,0,.3);color:#fff;font-weight:900}
    .marker span{font-size:.7rem}.marker.apt{background:var(--navy)}
    .facility-marker{width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.42);cursor:pointer;transition:transform .15s,opacity .15s}
    .dong-marker{padding:2px 5px;border:1.5px solid #203a60;border-radius:5px;background:rgba(255,255,255,.94);color:#152640;font-size:11px;font-weight:900;line-height:1;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.24);pointer-events:none}.dong-marker.hidden{display:none}.facility-marker:hover{transform:scale(1.25)}.facility-marker.receiver{background:var(--receiver-marker);border-radius:50%}.facility-marker.siamese{background:var(--siamese)}.facility-marker.hidden{display:none}
    .map-style-control{display:flex;flex-direction:column;gap:4px;margin:10px}.map-style-control button{min-width:76px;border:1px solid #c9d2df;border-radius:6px;background:#fff;color:#243550;padding:7px 9px;font-size:.76rem;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.13)}.map-style-control button.active{background:#203a60;color:#fff;border-color:#203a60}
    .detail{position:absolute;z-index:700;left:50%;bottom:18px;transform:translate(-50%,calc(100% + 40px));opacity:0;width:min(620px,calc(100% - 28px));background:#fff;border-radius:18px;box-shadow:var(--shadow);transition:.25s ease;padding:18px;pointer-events:none}
    .detail.open{transform:translate(-50%,0);opacity:1;pointer-events:auto}
    .detail-top{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
    .detail-type{font-size:.74rem;font-weight:800;margin-bottom:4px}.detail h2{font-size:1.08rem;margin:0 0 4px}.detail p{margin:0;color:var(--muted);font-size:.85rem;line-height:1.55}
    .close{border:0;background:#eef2f7;color:#40516a;width:34px;height:34px;border-radius:10px;font-size:1.1rem}
    .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.info{background:#f5f7fa;border-radius:10px;padding:10px}.info b{display:block;font-size:.72rem;color:var(--muted);margin-bottom:4px}.info span{font-size:.86rem;line-height:1.4}
    .notice{position:absolute;z-index:550;left:50%;bottom:14px;transform:translateX(-50%);background:#fff8db;color:#574600;border:1px solid #ead993;border-radius:999px;padding:8px 12px;font-size:.72rem;box-shadow:0 4px 14px rgba(0,0,0,.1);white-space:nowrap}
    .maplibregl-ctrl-attrib{font-size:9px!important}
    @media(max-width:720px){
      header{padding:11px 12px 10px}.badge{width:34px;height:34px}.subtitle{display:none}.draft{font-size:.66rem}.search-wrap{margin-top:9px}.locate{width:44px;padding:0;font-size:0}.locate::after{content:'◎';font-size:1.25rem}
      .map-style-control{flex-direction:row;gap:3px;margin:0 0 62px 10px}.map-style-control button{min-width:0;padding:7px 9px;font-size:.68rem}
      .legend{left:10px;right:auto;top:10px;padding:7px 9px;font-size:.68rem;line-height:1.5}.legend-title{margin-bottom:3px}
      .list-panel{left:auto;right:10px;top:10px;width:168px;max-height:34%;padding:7px;border-radius:12px}.panel-head{padding:1px 2px 6px}.panel-head strong{font-size:.8rem}.count{font-size:.68rem}.apt-card{padding:7px 8px;margin-bottom:5px;border-radius:9px}.apt-name{font-size:.76rem;line-height:1.35}.apt-address{display:none}.facility-count{margin-top:3px;font-size:.62rem;line-height:1.35}.notice{bottom:9px;width:calc(100% - 20px);max-width:680px;white-space:normal;text-align:center;line-height:1.35;padding:7px 12px}
      .detail{bottom:10px;padding:15px}.info-grid{grid-template-columns:1fr}.detail h2{font-size:1rem}
    }
  </style>
</head>

    const isLocalAndroid=/^(content:|file:)$/.test(location.protocol);
    const generalStyle=streetStyle;
    const map=new maplibregl.Map({container:'map',style:generalStyle,center:[127.1375,37.6040],zoom:12.5,maxZoom:20,attributionControl:true});
    map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
    class MapStyleControl{
      onAdd(mapInstance){this.map=mapInstance;this.container=document.createElement('div');this.container.className='maplibregl-ctrl map-style-control';[['일반지도',generalStyle],['위성지도',satelliteStyle]].forEach(([label,style],index)=>{const button=document.createElement('button');button.type='button';button.textContent=label;if(index===0)button.classList.add('active');button.addEventListener('click',()=>{this.container.querySelectorAll('button').forEach(b=>b.classList.remove('active'));button.classList.add('active');mapInstance.setStyle(style)});this.container.appendChild(button)});return this.container}
      onRemove(){this.container.remove();this.map=null}
    }
    map.addControl(new MapStyleControl(),'bottom-left');
    const markers = new Map();
    let selectedApartment = null;

    apartments.forEach(apt=>{ apt.facilities = apt.facilities || []; apt.buildings = embeddedDongLabels[apt.id] || []; });

    async function loadFacilities(){
      try{
        const data = embeddedFacilities;
        const byId = new Map(apartments.map(a=>[a.id,a]));
        let siameseCount=0, receiverCount=0, aptWithData=0;
        Object.keys(data).forEach(aptId=>{
          const apt = byId.get(aptId); if(!apt) return;
          const rec = data[aptId];
          const items = [];
          (rec['연결송수관']||[]).forEach((f,i)=>{items.push({id:`${aptId}-S${i+1}`,type:'siamese',label:f.label||`연결송수관 ${i+1}`,lng:f.lng,lat:f.lat,source:f.source||'현장 실측'});siameseCount++;});
          (rec['수신반']||[]).forEach((f,i)=>{items.push({id:`${aptId}-R${i+1}`,type:'receiver',label:f.label||`수신반 ${i+1}`,lng:f.lng,lat:f.lat,source:f.source||'현장 실측'});receiverCount++;});
          apt.facilities = items;
          if(items.length) aptWithData++;
        });
        return {siameseCount, receiverCount, aptWithData};
      }catch(err){
        console.warn('HTML 내부 시설 데이터 적용 실패 — 시설 데이터 없이 지도를 표시합니다.', err);
        return {siameseCount:0, receiverCount:0, aptWithData:0};
      }
    }

    function renderMap(){
      markers.forEach(marker=>marker.remove());markers.clear();
      apartments.filter(apt=>Number.isFinite(apt.lat)&&Number.isFinite(apt.lng)).forEach(apt=>{
        apt.buildings.forEach((building,index)=>{
          const label=document.createElement('div');label.className=`dong-marker ${map.getZoom()>=15.5?'':'hidden'}`;label.textContent=building.label;label.title=`${apt.name} · ${building.label}`;
          const buildingMarker=new maplibregl.Marker({element:label,anchor:'center'}).setLngLat([building.lng,building.lat]).addTo(map);
          markers.set(`${apt.id}-D${index+1}`,buildingMarker);
        });
        apt.facilities.forEach(facility=>{
          const dot=document.createElement('button');dot.type='button';dot.className=`facility-marker ${facility.type} ${selectedApartment===apt.id?'':'hidden'}`;dot.title=`${apt.name} · ${facility.label}`;dot.setAttribute('aria-label',dot.title);
          dot.addEventListener('click',e=>{e.stopPropagation();showFacility(apt,facility)});
          const facilityMarker=new maplibregl.Marker({element:dot,anchor:'center'}).setLngLat([facility.lng,facility.lat]).addTo(map);
          markers.set(facility.id,facilityMarker);
        });
      });
    }

    function updateDongVisibility(){
      const visible=map.getZoom()>=15.5;
      document.querySelectorAll('.dong-marker').forEach(label=>label.classList.toggle('hidden',!visible));
    }
    map.on('zoom',updateDongVisibility);

    function renderList(query=''){
      const q=query.trim().toLowerCase();
      const filtered=apartments.filter(a=>(a.name+' '+a.address).toLowerCase().includes(q));
      document.getElementById('count').textContent=`${filtered.length}개소`;
      document.getElementById('aptList').innerHTML=filtered.map(a=>`<button class="apt-card ${selectedApartment===a.id?'active':''}" data-id="${a.id}"><div class="apt-name">${a.no}. ${a.name}</div><div class="apt-address">${a.address}</div><div class="facility-count">${a.grade} · ${a.blocks}개 동 · ${a.floors}${a.buildings.length?` · 동 위치 ${a.buildings.length}개`:' · 동 위치 미확인'}${a.facilities.length?` · 시설 ${a.facilities.length}개`:''}</div></button>`).join('') || '<p style="font-size:.82rem;color:#627086;padding:8px">검색 결과가 없습니다.</p>';
      document.querySelectorAll('.apt-card').forEach(el=>el.addEventListener('click',()=>selectApartment(el.dataset.id)));
    }

    function selectApartment(id){
      selectedApartment=id; const apt=apartments.find(a=>a.id===id); if(!apt)return;
      renderMap(); renderList(document.getElementById('searchInput').value);
      if(Number.isFinite(apt.lat)&&Number.isFinite(apt.lng)){
        if(apt.facilities.length || apt.buildings.length){
          const points=[...apt.facilities,...apt.buildings];
          const bounds=points.reduce((box,item)=>box.extend([item.lng,item.lat]),new maplibregl.LngLatBounds([apt.lng,apt.lat],[apt.lng,apt.lat]));

        }else{
          map.easeTo({center:[apt.lng,apt.lat],zoom:18,duration:500});
        }
      }
      showApartment(apt);
    }

    function showApartment(apt){
      const naverUrl=`https://map.naver.com/p/entry/place/${apt.naverPlaceId}`;
      setDetail('공동주택',apt.name,apt.address,[['도로명주소',apt.roadAddress],['소방안전관리 등급',apt.grade],['동수',`${apt.blocks}개 동`],['공식 동 위치',apt.buildings.length?`${apt.buildings.length}개 확인`:'원본 GIS에 동 번호 없음'],['층수',apt.floors],['지도 위치','네이버지도 검색 결과 확인'],['네이버지도',`<a href="${naverUrl}" target="_blank" rel="noopener noreferrer">네이버지도에서 보기 ↗</a>`]]);

    function showFacility(apt,facility){
      const type=facility.type==='receiver'?'수신반':'연결송수관';
      setDetail(type,facility.label,apt.name,[['시설 구분',type],['단지 주소',apt.address],['위치 근거',facility.source],['표시 안내','엑셀 시설좌표입력 시트의 GPS 실측 좌표']]);
    }

    function setDetail(type,title,subtitle,items){
      const color=type==='수신반'?'#1677d2':type==='연결송수관'?'#e33b42':'#203a60';
      const t=document.getElementById('detailType');t.textContent=type;t.style.color=color;
      document.getElementById('detailTitle').textContent=title;document.getElementById('detailSubtitle').textContent=subtitle;
      document.getElementById('detailGrid').innerHTML=items.map(([k,v])=>`<div class="info"><b>${k}</b><span>${v}</span></div>`).join('');
      document.getElementById('detail').classList.add('open');
    }

    document.getElementById('closeDetail').addEventListener('click',()=>document.getElementById('detail').classList.remove('open'));
    document.getElementById('searchInput').addEventListener('input',e=>{renderList(e.target.value);document.getElementById('clearBtn').style.display=e.target.value?'block':'none'});
    document.getElementById('clearBtn').addEventListener('click',()=>{const i=document.getElementById('searchInput');i.value='';i.focus();renderList();document.getElementById('clearBtn').style.display='none'});
    document.getElementById('locateBtn').addEventListener('click',()=>{
      if(!navigator.geolocation){alert('현재 위치 기능을 사용할 수 없습니다.');return;}
      navigator.geolocation.getCurrentPosition(p=>{map.easeTo({center:[p.coords.longitude,p.coords.latitude],zoom:17,duration:500});const dot=document.createElement('div');dot.title='현재 위치';dot.style.cssText='width:18px;height:18px;border-radius:50%;background:#2d8cff;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35)';new maplibregl.Marker({element:dot}).setLngLat([p.coords.longitude,p.coords.latitude]).addTo(map);},()=>alert('위치 권한을 허용해 주세요.'));
    });

    (async function init(){
      const stats = await loadFacilities();
      renderMap();
      renderList();
      const notice = document.getElementById('notice');
      if(notice){
        notice.textContent = stats.aptWithData
          ? `${stats.aptWithData}/${apartments.length}개 단지 시설 데이터 반영 · 연결송수관 ${stats.siameseCount}개 · 수신반 ${stats.receiverCount}개`
          : '시설 좌표 데이터가 아직 없습니다';
        if(isLocalAndroid) notice.textContent += ' · 일반지도는 http:// 주소로 열어야 정상 표시됩니다';
      }
      const draftBadge = document.querySelector('.draft');
      if(draftBadge) draftBadge.textContent = `${stats.aptWithData}/${apartments.length}개 단지 반영`;
    })();
  </script>
</body>
</html>
